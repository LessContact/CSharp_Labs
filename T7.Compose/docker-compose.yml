services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - philosophers-net

  table-service:
    build:
      context: ..
      dockerfile: ./T7.TableService/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - PHILOSOPHERS_COUNT=5
      - DisplayIntervalMs=500
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - philosophers-net

  coordinator-service:
    build:
      context: ..
      dockerfile: ./T7.CoordinatorService/Dockerfile
    ports:
      - "8090:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - PHILOSOPHERS_COUNT=5
      - RABBITMQ_HOST=rabbitmq
      - COORDINATOR_STEP_INTERVAL_MS=10
      - TABLE_SERVICE_URL=http://table-service:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
      table-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - philosophers-net

  philosopher-plato:
    build:
      context: ..
      dockerfile: ./T7.PhilosopherService/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:8081
      - PHILOSOPHER_NAME=Платон
      - PHILOSOPHER_ID=philosopher-1
      - LEFT_FORK_ID=0
      - RIGHT_FORK_ID=1
      - TABLE_SERVICE_URL=http://table-service:8080
      - RABBITMQ_HOST=rabbitmq
      - SIMULATION_DURATION_MINUTES=1
      - THINKING_TIME_MIN_MS=100
      - THINKING_TIME_MAX_MS=300
      - EATING_TIME_MIN_MS=100
      - EATING_TIME_MAX_MS=200
      - FORK_ACQUISITION_TIME_MS=30
      - RETRY_DELAY_MS=10
    depends_on:
      table-service:
        condition: service_healthy
      coordinator-service:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks:
      - philosophers-net

  philosopher-aristotle:
