services:
  table-service:
    build:
      context: ..
      dockerfile: ./T6.TableService/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - PHILOSOPHERS_COUNT=5
      - DisplayIntervalMs=500
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - philosophers-net

  philosopher-plato:
    build:
      context: ..
      dockerfile: ./T6.PhilosopherService/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:8081
      - PHILOSOPHER_NAME=Платон
      - PHILOSOPHER_ID=philosopher-1
      - LEFT_FORK_ID=0
      - RIGHT_FORK_ID=1
      - TABLE_SERVICE_URL=http://table-service:8080
      - SIMULATION_DURATION_MINUTES=1
      - THINKING_TIME_MIN_MS=100
      - THINKING_TIME_MAX_MS=300
      - EATING_TIME_MIN_MS=100
      - EATING_TIME_MAX_MS=200
      - FORK_ACQUISITION_TIME_MS=30
      - RETRY_DELAY_MS=10
      - STRATEGY=Hierarchy
    depends_on:
      table-service:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks:
      - philosophers-net

  philosopher-aristotle:
